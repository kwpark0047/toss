name: DB Migrate (approval required)
on:
  workflow_dispatch:
    inputs:
      target:
        description: Existing protected environment (explicit migration authorization required)
        required: true
        type: choice
        options: [staging, production]
concurrency:
  group: db-migrate-${{ inputs.target }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify opt-in and protected environment before binding it
        run: node scripts/verify-migration-approval.cjs
        env:
          ENABLE_APPROVED_DB_MIGRATIONS: ${{ vars.ENABLE_APPROVED_DB_MIGRATIONS }}
          MIGRATION_TARGET: ${{ inputs.target }}
          GH_TOKEN: ${{ github.token }}
  migrate:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Recheck protection after platform approval
        run: node scripts/verify-migration-approval.cjs
        env:
          ENABLE_APPROVED_DB_MIGRATIONS: ${{ vars.ENABLE_APPROVED_DB_MIGRATIONS }}
          MIGRATION_TARGET: ${{ inputs.target }}
          GH_TOKEN: ${{ github.token }}
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Dry run (read-only plan)
        run: node scripts/deploy-migrations.cjs
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      - name: Apply pending migrations
        run: node scripts/deploy-migrations.cjs --apply
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      - name: Verify nothing is pending
        run: node scripts/deploy-migrations.cjs --check
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
