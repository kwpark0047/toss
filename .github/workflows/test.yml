name: Integration Tests (Scheduled)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0' # 주간 일요일 새벽 3시

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@localhost:5432/wemarket_test
      DIRECT_URL: postgresql://test:test@localhost:5432/wemarket_test
      JWT_SECRET: test-secret
      JWT_REFRESH_SECRET: test-refresh-secret
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: wemarket_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Prepare Supabase roles in disposable CI database
        run: psql "$DATABASE_URL" --set ON_ERROR_STOP=1 --file scripts/ci/supabase-roles.sql
      - name: Run database migrations
        run: node scripts/deploy-migrations.cjs --apply
      - name: Run integration tests
        run: node scripts/run-jest.cjs --config jest.config.integration.js --no-cache --forceExit
