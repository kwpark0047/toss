name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # 수동 트리거로 무거운 잡 실행 가능
  workflow_dispatch:
    inputs:
      job:
        description: '실행할 잡 선택'
        required: false
        type: choice
        options:
          - all
          - backend-integration-tests
          - e2e-tests
          - security-scan
          - deploy
          - docker-build
          - trivy-image-scan
          - bundle-size-check
          - lighthouse-ci
          - print-agent-test

jobs:
  # === 필수 실행 잡 (push/PR마다 실행, 무료 티어 내 유지) ===
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/wemarket_test
      DIRECT_URL: postgresql://test:test@localhost:5432/wemarket_test
      NODE_ENV: test
      JWT_SECRET: test-secret
      JWT_REFRESH_SECRET: test-refresh-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Prisma Schema Validation
        run: |
          npx prisma generate
          npx prisma validate

      - name: Unit & Integration Tests (light)
        run: npm run test:coverage

      - name: Route Validation
        run: npm run validate:routes

      - name: API Contract Validation
        run: npm run validate:api

      - name: JSX Reference Validation
        run: node scripts/validate-jsx-references.js

  backend-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: wemarket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/wemarket_test
      NODE_ENV: test
      SMS_ENV: dev
      JWT_SECRET: test-secret
      JWT_REFRESH_SECRET: test-refresh-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run backend unit tests
        run: npx jest --config jest.config.js tests/unit/ --no-cache --forceExit --coverage

      - name: Upload unit test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage
          path: coverage/
          retention-days: 7

  backend-regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      SMS_ENV: dev
      JWT_SECRET: test-secret
      JWT_REFRESH_SECRET: test-refresh-secret
      DATABASE_URL: postgresql://test:test@localhost:5432/wemarket_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run regression tests
        run: npx jest --config jest.config.js tests/regression/ --no-cache --forceExit --coverage

      - name: Upload regression test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-coverage
          path: coverage/
          retention-days: 7

  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm run test:coverage
      - name: Type check
        run: npm run typecheck

      - name: Upload frontend test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7
        env:
          VITE_API_URL: http://localhost:3000/api

  # === 수동 트리거 잡 (workflow_dispatch로만 실행) ===
  backend-integration-tests:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: backend-unit-tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: wemarket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/wemarket_test
      DIRECT_URL: postgresql://test:test@localhost:5432/wemarket_test?schema=public
      NODE_ENV: test
      SMS_ENV: dev
      JWT_SECRET: test-secret
      JWT_REFRESH_SECRET: test-refresh-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Seed test database
        run: node scripts/seed_test.js || true

      - name: Run integration tests (mocked, fast)
        run: npx jest --config jest.config.integration.js --no-cache --forceExit --verbose

      - name: Run integration tests (with real DB)
        run: npx jest --config jest.config.js tests/integration/ --no-cache --forceExit --verbose --testTimeout=60000

      - name: Upload integration test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-coverage
          path: coverage/
          retention-days: 7

  e2e-tests:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend-integration-tests, frontend-test]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: wemarket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Seed test database
        run: node scripts/seed_test.js || true

      - name: Start backend server
        run: |
          nohup node index.js > backend.log 2>&1 &
          sleep 15
          cat backend.log
          curl -f http://localhost:3000/api/health || exit 1
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/wemarket_test
          DIRECT_URL: postgresql://test:test@localhost:5432/wemarket_test
          JWT_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Start frontend preview server
        run: |
          cd frontend
          nohup npx serve dist -l 5173 > frontend.log 2>&1 &
          sleep 5
          cat frontend.log
          curl -f http://localhost:5173 || exit 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test
        env:
          PLAYWRIGHT_API_URL: http://localhost:3000
          PLAYWRIGHT_BASE_URL: http://localhost:5173

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright traces
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  print-agent-test:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: print-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: print-agent/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run print-agent tests
        run: npx jest --no-cache

  security-scan:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Semgrep
        run: |
          pipx install semgrep
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Verify Semgrep installation
        run: semgrep --version
      - name: Run Semgrep (backend)
        run: npm run security:scan
      - name: Run Semgrep (frontend)
        run: npm run security:scan:frontend

  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    needs:
      [
        lint-and-test,
        backend-unit-tests,
        backend-integration-tests,
        backend-regression-tests,
        frontend-test,
        e2e-tests,
        security-scan,
        docker-build,
        trivy-image-scan,
        bundle-size-check,
        lighthouse-ci,
        frontend-lint,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Render (backend)
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

      - name: Build frontend
        run: npm run cloudflare-build

      - name: Deploy to Cloudflare Workers (frontend)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.119.0'
          workingDirectory: frontend

  # Docker build and security scan
  docker-build:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      [
        lint-and-test,
        backend-unit-tests,
        backend-integration-tests,
        backend-regression-tests,
        frontend-test,
      ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          load: true
          tags: wemarket-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          load: true
          tags: wemarket-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker images
        run: |
          docker save wemarket-api:latest wemarket-frontend:latest | gzip > wemarket-images.tar.gz

      - name: Upload Docker images artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: wemarket-images.tar.gz
          retention-days: 1

  # Image vulnerability scan (separate from docker-build)
  trivy-image-scan:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: docker-build
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images

      - name: Load Docker images
        run: gunzip -c wemarket-images.tar.gz | docker load

      - name: Run Trivy vulnerability scanner (backend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'wemarket-api:latest'
          format: 'sarif'
          output: 'trivy-backend.sarif'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          scanners: 'vuln,secret'

      - name: Upload Trivy SARIF (backend) to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: 'trivy-backend.sarif'

      - name: Run Trivy full report (backend, non-blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'wemarket-api:latest'
          format: 'table'
          output: 'trivy-backend-report.txt'
          exit-code: '0'
          ignore-unfixed: true
          scanners: 'vuln,secret'

      - name: Generate SBOM (backend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'wemarket-api:latest'
          format: 'cyclonedx'
          output: 'trivy-backend.sbom.json'
          list-all-pkgs: 'true'
          exit-code: '0'

      - name: Run Trivy vulnerability scanner (frontend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'wemarket-frontend:latest'
          format: 'sarif'
          output: 'trivy-frontend.sarif'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          scanners: 'vuln,secret'

      - name: Upload Trivy SARIF (frontend) to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: 'trivy-frontend.sarif'

      - name: Run Trivy full report (frontend, non-blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'wemarket-frontend:latest'
          format: 'table'
          output: 'trivy-frontend-report.txt'
          exit-code: '0'
          ignore-unfixed: true
          scanners: 'vuln,secret'

      - name: Generate SBOM (frontend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'wemarket-frontend:latest'
          format: 'cyclonedx'
          output: 'trivy-frontend.sbom.json'
          list-all-pkgs: 'true'
          exit-code: '0'

      - name: Upload Trivy reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            trivy-backend.sarif
            trivy-frontend.sarif
            trivy-backend-report.txt
            trivy-frontend-report.txt
            trivy-backend.sbom.json
            trivy-frontend.sbom.json
          retention-days: 7

  bundle-size-check:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint-and-test, backend-unit-tests, frontend-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run cloudflare-build
      - name: Check bundle size
        run: |
          npm run bundle:check

  lighthouse-ci:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: bundle-size-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run cloudflare-build
      - name: Serve built site
        run: npx serve frontend/dist -l 5173 &
      - name: Wait for server
        run: sleep 5
      - name: Run Lighthouse CI
        run: npx lhci autorun --config=lighthouserc.js

  # 프론트엔드 린트 — 비차단 검토용(advisory) 잡
  frontend-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint (advisory)
        run: |
          npm run lint > eslint-report.txt 2>&1 || true
          echo "::warning::Frontend ESLint has pre-existing debt. See eslint-report.txt artifact."
      - name: Upload ESLint report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-eslint-report
          path: frontend/eslint-report.txt