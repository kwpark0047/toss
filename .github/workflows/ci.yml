name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/wemarket_test
      DIRECT_URL: postgresql://test:test@localhost:5432/wemarket_test
      NODE_ENV: test
      JWT_SECRET: test-secret
      JWT_REFRESH_SECRET: test-refresh-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Prisma Schema Validation
        run: |
          npx prisma generate
          npx prisma validate

      - name: Unit & Integration Tests
        run: npm run test:coverage

      - name: Route Validation
        run: npm run validate:routes

  backend-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: wemarket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/wemarket_test
      NODE_ENV: test
      SMS_ENV: dev
      JWT_SECRET: test-secret
      JWT_REFRESH_SECRET: test-refresh-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run backend unit tests
        run: npx jest --config jest.config.js tests/unit/ --no-cache --forceExit

  backend-integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: backend-unit-tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: wemarket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/wemarket_test
      DIRECT_URL: postgresql://test:test@localhost:5432/wemarket_test?schema=public
      NODE_ENV: test
      SMS_ENV: dev
      JWT_SECRET: test-secret
      JWT_REFRESH_SECRET: test-refresh-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Sync database schema
        run: npx prisma db push --skip-generate

      - name: Run integration tests
        run: npx jest --config jest.config.js tests/integration/ --no-cache --forceExit

  backend-regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 회귀 테스트는 Prisma를 mock 처리하므로 Postgres 의존성 없이 샌드박스 단위 테스트처럼 실행된다.
    # (integration job과 순서를 맞추어 DB 마이그레이션 검증과 병렬 가능하도록 needs 없이 독립 실행)
    env:
      NODE_ENV: test
      SMS_ENV: dev
      JWT_SECRET: test-secret
      JWT_REFRESH_SECRET: test-refresh-secret
      DATABASE_URL: postgresql://test:test@localhost:5432/wemarket_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run regression tests
        run: npx jest --config jest.config.js tests/regression/ --no-cache --forceExit

  print-agent-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: print-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: print-agent/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run print-agent tests
        run: npx jest --no-cache

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs:
      [
        lint-and-test,
        backend-unit-tests,
        backend-integration-tests,
        backend-regression-tests,
        frontend-test,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Render (backend)
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

      - name: Build frontend
        run: npm run cloudflare-build

      - name: Deploy to Cloudflare Workers (frontend)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.119.0'
          workingDirectory: frontend

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Semgrep
        run: |
          pipx install semgrep
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Verify Semgrep installation
        run: semgrep --version
      - name: Run Semgrep (backend)
        run: npm run security:scan
      - name: Run Semgrep (frontend)
        run: npm run security:scan:frontend

  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm run test:coverage
      - name: Type check
        run: npm run typecheck
        env:
          VITE_API_URL: http://localhost:3000/api

  # 프론트엔드 린트 — 비차단 검토용(advisory) 잡
  # [배경] 프론트엔드에 pre-existing React 19 strict-mode 규칙 위반(react-hooks/set-state-in-effect)과
  # unused-vars debt가 100여 건 존재. 이를 하나의 CI 게이트로 끊는 데에는 대규모 리팩터링이 필요해
  # 차단 없이 보고(advisory) 형태로 운영: 린트 리포트를 아티팩트로 수집·팀가시성 확보.
  # 목표: 향후 `allow-lint-errors` 임계값(0) 채택 시 차단하도록 전환 가능.
  frontend-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint (advisory)
        run: |
          npm run lint > eslint-report.txt 2>&1 || true
          echo "::warning::Frontend ESLint has pre-existing debt. See eslint-report.txt artifact."
      - name: Upload ESLint report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-eslint-report
          path: frontend/eslint-report.txt

  # Docker build and security scan
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      [
        lint-and-test,
        backend-unit-tests,
        backend-integration-tests,
        backend-regression-tests,
        frontend-test,
      ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          load: true
          tags: wemarket-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          load: true
          tags: wemarket-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker images
        run: |
          docker save wemarket-api:latest wemarket-frontend:latest | gzip > wemarket-images.tar.gz

      - name: Upload Docker images artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: wemarket-images.tar.gz
          retention-days: 1

  # Image vulnerability scan (separate from docker-build)
  trivy-image-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: docker-build
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images

      - name: Load Docker images
        run: gunzip -c wemarket-images.tar.gz | docker load

      - name: Run Trivy vulnerability scanner (backend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'wemarket-api:latest'
          format: 'sarif'
          output: 'trivy-backend.sarif'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          scanners: 'vuln,secret'

      - name: Upload Trivy SARIF (backend) to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-backend.sarif'

      - name: Run Trivy full report (backend, non-blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'wemarket-api:latest'
          format: 'table'
          output: 'trivy-backend-report.txt'
          exit-code: '0'
          ignore-unfixed: true
          scanners: 'vuln,secret'

      - name: Generate SBOM (backend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'wemarket-api:latest'
          format: 'cyclonedx'
          output: 'trivy-backend.sbom.json'
          list-all-pkgs: 'true'
          exit-code: '0'

      - name: Run Trivy vulnerability scanner (frontend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'wemarket-frontend:latest'
          format: 'sarif'
          output: 'trivy-frontend.sarif'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          scanners: 'vuln,secret'

      - name: Upload Trivy SARIF (frontend) to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-frontend.sarif'

      - name: Run Trivy full report (frontend, non-blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'wemarket-frontend:latest'
          format: 'table'
          output: 'trivy-frontend-report.txt'
          exit-code: '0'
          ignore-unfixed: true
          scanners: 'vuln,secret'

      - name: Generate SBOM (frontend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'wemarket-frontend:latest'
          format: 'cyclonedx'
          output: 'trivy-frontend.sbom.json'
          list-all-pkgs: 'true'
          exit-code: '0'

      - name: Upload Trivy reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            trivy-backend.sarif
            trivy-frontend.sarif
            trivy-backend-report.txt
            trivy-frontend-report.txt
            trivy-backend.sbom.json
            trivy-frontend.sbom.json
          retention-days: 7

  bundle-size-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint-and-test, backend-unit-tests, frontend-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run cloudflare-build
      - name: Check bundle size
        run: |
          npm run bundle:check

  lighthouse-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: bundle-size-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run cloudflare-build
      - name: Serve built site
        run: npx serve frontend/dist -l 5173 &
      - name: Wait for server
        run: sleep 5
      - name: Run Lighthouse CI
        run: npx lhci autorun --config=lighthouserc.js
