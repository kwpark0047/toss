name: Playwright E2E Tests (Scheduled)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0' # 주간 일요일 새벽 3시

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: wemarket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Install frontend dependencies
        run: cd frontend && npm ci --prefer-offline --no-audit --no-fund
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Run database migrations
        run: npx prisma migrate deploy
      - name: Seed test database
        run: node scripts/seed_test.js || true
      - name: Start backend server
        run: |
          nohup node index.js > backend.log 2>&1 &
          sleep 10
          cat backend.log
          curl -f http://localhost:3000/api/health || exit 1
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/wemarket_test
          DIRECT_URL: postgresql://test:test@localhost:5432/wemarket_test
          JWT_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret
      - name: Build frontend
        run: cd frontend && npm run build
      - name: Start frontend preview server
        run: |
          cd frontend
          nohup npx serve dist -l 5173 > frontend.log 2>&1 &
          sleep 3
          cat frontend.log
          curl -f http://localhost:5173 || exit 1
        env:
          NODE_ENV: test
          CI: true
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test --project=chromium
        env:
          PLAYWRIGHT_API_URL: http://localhost:3000
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3
