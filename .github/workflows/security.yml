# Security Scanning Pipeline - Lightweight
# Automatic text-change secret/dependency review; full scans run in CI and manual mode.
# Scans: Code (Semgrep), Dependencies (npm audit)

name: Security Scanning

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**/*.png'
      - '!**/*.jpg'
      - '!**/*.jpeg'
      - '!**/*.gif'
      - '!**/*.webp'
      - '!**/*.ico'
      - '!**/*.woff'
      - '!**/*.woff2'
      - '!**/*.ttf'
      - '!**/*.mp4'
  pull_request:
    paths:
      - '**'
      - '!**/*.png'
      - '!**/*.jpg'
      - '!**/*.jpeg'
      - '!**/*.gif'
      - '!**/*.webp'
      - '!**/*.ico'
      - '!**/*.woff'
      - '!**/*.woff2'
      - '!**/*.ttf'
      - '!**/*.mp4'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  semgrep:
    if: github.event_name == 'workflow_dispatch'
    name: Semgrep Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Install Semgrep
        run: |
          pipx install semgrep
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run Semgrep (backend)
        run: npm run security:scan

      - name: Run Semgrep (frontend)
        run: npm run security:scan:frontend

  npm-audit:
    if: github.event_name == 'workflow_dispatch'
    name: NPM Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run npm audit
        run: npm audit --json --audit-level=high > npm-audit.json

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit
          path: npm-audit.json
          retention-days: 3

      - name: Check for high/critical vulnerabilities
        run: |
          HIGH=$(jq '[.vulnerabilities[] | select(.severity == "high")] | length' npm-audit.json)
          CRITICAL=$(jq '[.vulnerabilities[] | select(.severity == "critical")] | length' npm-audit.json)
          echo "High: $HIGH, Critical: $CRITICAL"
          if [ "$HIGH" -gt 0 ] || [ "$CRITICAL" -gt 0 ]; then
            echo "::error::Found $CRITICAL critical and $HIGH high vulnerabilities"
            exit 1
          fi

      - name: Audit frontend dependencies
        run: npm --prefix frontend audit --audit-level=high

  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --json

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          config-file: '.github/dependency-review-config.yml'
          fail-on-severity: high
