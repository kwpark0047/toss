# ==============================================================================
# Security Scanning Pipeline
# ==============================================================================
# Runs on every PR and scheduled daily
# Scans: Container (Trivy), Code (Semgrep), Dependencies (npm audit), Secrets (TruffleHog)
# ==============================================================================

name: Security Scanning

on:
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:

permissions:
  security-events: write
  contents: read
  packages: read

jobs:
  trivy-container:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t wemarket-api:${{ github.sha }} .
          docker tag wemarket-api:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/wemarket-api:${{ github.sha }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository_owner }}/wemarket-api:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: true
          vuln-type: 'os,library'
          exit-code: '1'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '1'

      - name: Upload Trivy FS results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs

  semgrep:
    name: Semgrep Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/ci
            p/javascript
            p/typescript
            p/nodejs
            p/expressjs
            p/security-audit
            p/secrets
            p/owasp-top-ten
          generateSarif: true

      - name: Upload Semgrep results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  npm-audit:
    name: NPM Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run npm audit
        run: npm audit --json --audit-level=high > npm-audit.json || true

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit
          path: npm-audit.json

      - name: Check for high/critical vulnerabilities
        run: |
          HIGH=$(jq '[.vulnerabilities[] | select(.severity == "high")] | length' npm-audit.json)
          CRITICAL=$(jq '[.vulnerabilities[] | select(.severity == "critical")] | length' npm-audit.json)
          echo "High: $HIGH, Critical: $CRITICAL"
          if [ "$HIGH" -gt 0 ] || [ "$CRITICAL" -gt 0 ]; then
            echo "::error::Found $CRITICAL critical and $HIGH high vulnerabilities"
            exit 1
          fi

  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --json --fail

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          config-file: '.github/dependency-review-config.yml'
          fail-on-severity: high

  snyk:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Snyk
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --severity-threshold=high --json > snyk-results.json || true

      - name: Upload Snyk results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-results
          path: snyk-results.json

  # Consolidated security summary
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [trivy-container, trivy-fs, semgrep, npm-audit, trufflehog, dependency-review, snyk]
    if: always()
    steps:
      - name: Check all security jobs passed
        run: |
          echo "Security scan summary:"
          echo "Trivy Container: ${{ needs.trivy-container.result }}"
          echo "Trivy FS: ${{ needs.trivy-fs.result }}"
          echo "Semgrep: ${{ needs.semgrep.result }}"
          echo "NPM Audit: ${{ needs.npm-audit.result }}"
          echo "TruffleHog: ${{ needs.trufflehog.result }}"
          echo "Dependency Review: ${{ needs.dependency-review.result }}"
          echo "Snyk: ${{ needs.snyk.result }}"
          
          if [[ "${{ needs.trivy-container.result }}" != "success" ]] || \
             [[ "${{ needs.trivy-fs.result }}" != "success" ]] || \
             [[ "${{ needs.semgrep.result }}" != "success" ]] || \
             [[ "${{ needs.npm-audit.result }}" != "success" ]] || \
             [[ "${{ needs.trufflehog.result }}" != "success" ]] || \
             [[ "${{ needs.dependency-review.result }}" != "success" ]]; then
            echo "::error::One or more security scans failed"
            exit 1
          fi
