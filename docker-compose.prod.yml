# ==============================================================================
# WeMarket - Production Docker Compose
# ==============================================================================
# Usage: docker-compose -f docker-compose.prod.yml up -d
# Requires: .env.prod file with all required environment variables
# ==============================================================================

version: '3.9'

# ==============================================================================
# Networks
# ==============================================================================
networks:
  wemarket-frontend:
    name: wemarket-frontend
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
  
  wemarket-backend:
    name: wemarket-backend
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
      # Internal network - no external access
      com.docker.network.driver.mtu: "1450"

  wemarket-monitoring:
    name: wemarket-monitoring
    driver: bridge

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/postgres
  
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/redis
  
  prometheus_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/prometheus
  
  grafana_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/grafana
  
  loki_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/loki
  
  app_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/logs/app

# ==============================================================================
# Services
# ==============================================================================
services:
  # -----------------------------------------------------------------------------
  # PostgreSQL Database (Primary)
  # -----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: wemarket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-wemarket}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-wemarket}
      # Performance tuning
      POSTGRES_MAX_CONNECTIONS: "200"
      POSTGRES_SHARED_BUFFERS: "256MB"
      POSTGRES_EFFECTIVE_CACHE_SIZE: "1GB"
      POSTGRES_WORK_MEM: "16MB"
      POSTGRES_MAINTENANCE_WORK_MEM: "128MB"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wemarket-backend
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wemarket} -d ${DB_NAME:-wemarket}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Backup sidecar would be added here in production

  # -----------------------------------------------------------------------------
  # Redis (Cache, Sessions, Queues, Rate Limiting)
  # -----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: wemarket-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis_data:/data
    networks:
      - wemarket-backend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # -----------------------------------------------------------------------------
  # WeMarket API Application
  # -----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      # Build args for labeling
      args:
        BUILD_DATE: ${BUILD_DATE:-unknown}
        VCS_REF: ${VCS_REF:-unknown}
        VERSION: ${VERSION:-1.0.0}
    container_name: wemarket-api
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      - NODE_ENV=production
      - APP_VERSION=1.0.0
      - PORT=3000
      - DATABASE_URL=postgresql://${DB_USER:-wemarket}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-wemarket}?schema=public
      - DIRECT_URL=postgresql://${DB_USER:-wemarket}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-wemarket}?schema=public
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=info
    networks:
      - wemarket-backend
      - wemarket-frontend
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 30s
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s
        failure_action: pause
        monitor: 30s
    volumes:
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const options={hostname:'localhost',port:3000,path:'/api/health/deep',timeout:3000};const req=http.request(options,(res)=>{process.exit(res.statusCode===200?0:1)});req.on('error',()=>process.exit(1));req.end();"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=wemarket-api"

  # -----------------------------------------------------------------------------
  # Frontend (Nginx Static Server)
  # -----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: wemarket-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - wemarket-frontend
    depends_on:
      - app
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # -----------------------------------------------------------------------------
  # Prometheus (Metrics Collection)
  # -----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: wemarket-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks:
      - wemarket-monitoring
      - wemarket-backend
    ports:
      - "9090:9090"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # -----------------------------------------------------------------------------
  # Grafana (Visualization)
  # -----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.3.3
    container_name: wemarket-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://${GRAFANA_DOMAIN:-grafana.wemarket.com}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    networks:
      - wemarket-monitoring
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # -----------------------------------------------------------------------------
  # Loki (Log Aggregation)
  # -----------------------------------------------------------------------------
  loki:
    image: grafana/loki:2.9.4
    container_name: wemarket-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - wemarket-monitoring
    ports:
      - "3100:3100"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # -----------------------------------------------------------------------------
  # Promtail (Log Shipper)
  # -----------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:2.9.4
    container_name: wemarket-promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
      - app_logs:/app/logs:ro
    networks:
      - wemarket-monitoring
      - wemarket-backend
      - wemarket-frontend
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M

  # -----------------------------------------------------------------------------
  # Alertmanager (Alert Routing)
  # -----------------------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: wemarket-alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - wemarket-monitoring
    ports:
      - "9093:9093"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M

  # -----------------------------------------------------------------------------
  # Node Exporter (Host Metrics)
  # -----------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: wemarket-node-exporter
    restart: unless-stopped
    pid: host
    network_mode: host
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
        reservations:
          cpus: '0.01'
          memory: 16M

  # -----------------------------------------------------------------------------
  # Cadvisor (Container Metrics)
  # -----------------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: wemarket-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - wemarket-monitoring
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

# ==============================================================================
# Secrets (External - managed by Docker Secrets or external secret manager)
# ==============================================================================
# In production, use Docker Secrets or external secret manager (HashiCorp Vault, AWS Secrets Manager)
# Example:
# secrets:
#   db_password:
#     external: true
#   jwt_secret:
#     external: true
#   redis_password:
#     external: true
