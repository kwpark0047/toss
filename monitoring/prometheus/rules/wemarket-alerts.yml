    #     team: platform
    #   annotations:
    #     summary: "Disk space low on {{ $labels.instance }}"
    #     description: "Available disk space is {{ $value | humanizePercentage }} (threshold: 15%)"

  # ----------------------------------------------------------------------
  # Kubernetes
  # ----------------------------------------------------------------------
  - alert: WemarketPodRestartLoop
    expr: |
      rate(kube_pod_container_status_restarts_total[15m]) > 0.05
    for: 5m
    labels:
      severity: warning
      team: platform
    annotations:
      summary: "Pod {{ $labels.pod }} restarting frequently"
      description: "Restart rate is {{ $value }} restarts/minute"

    # - alert: WemarketDeploymentReplicasMismatch
    #   expr: |
