  # ----------------------------------------------------------------------
  # Business Metrics
  # ----------------------------------------------------------------------
  - alert: WemarketOrderVolumeDrop
    expr: |
      rate(orders_created_total[15m]) < 0.1
    for: 10m
    labels:
      severity: warning
      team: business
    annotations:
      summary: "Order volume dropped significantly"
      description: "Order rate is {{ $value }}/min (threshold: 0.1/min)"

