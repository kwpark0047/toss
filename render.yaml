# Render Infrastructure as Code — 백엔드 API 서버
# 대시보드 수동 설정 대신 이 파일로 배포를 재현 가능하게 관리한다.
# 적용: Render 대시보드 → Blueprints → 이 저장소 연결 (기존 서비스는 설정 동기화)
#
# 주의: sync:false 로 표시된 시크릿은 Render 대시보드에서 직접 입력해야 하며
#       이 파일에는 절대 값을 커밋하지 않는다.
services:
  - type: web
    name: wemarket
    runtime: node
    region: singapore # Supabase(ap-southeast-1)와 동일 리전으로 DB 왕복 최소화
    plan: free
    branch: main
    # --include=dev 는 필수다. 이 서비스는 NODE_ENV=production 이고 npm 의 omit 기본값이
    # 그 경우 dev 로 전환되므로, prisma CLI(devDependency)가 설치되지 않아
    # postinstall(prisma generate) 이 exit 127 로 죽고 빌드 전체가 실패한다.
    # 빌드는 운영 DB를 변경하지 않는다. --check 는 읽기 전용으로 미적용 migration 을 확인하고,
    # 남아 있으면 빌드를 실패시켜 스키마보다 앞선 코드가 배포되지 않게 한다.
    # migration 적용은 승인형 GitHub Actions 워크플로(.github/workflows/db-migrate.yml)에서만 한다.
    buildCommand: npm ci --include=dev && node scripts/deploy-migrations.cjs --check && npx prisma generate
    startCommand: node --import tsx index.mts
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      # ── DB (Supabase) ──
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # ── 인증·암호화 ──
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: PHONE_ENC_KEY
        sync: false
      # ── 간편 이메일 가입 (검증 후 운영자가 명시적으로 활성화) ──
      - key: FREE_AUTH_SIMPLE_SIGNUP_ENABLED
        value: false
      - key: FREE_AUTH_TERMS_URL
        value: https://wemarket-saas.vercel.app/platform/terms.html
      - key: FREE_AUTH_PRIVACY_URL
        value: https://wemarket-saas.vercel.app/platform/privacy.html
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: BILLING_SCHEDULER_ENABLED
        value: false
      - key: SUPABASE_PRIVATE_BUCKET
        value: payment-proofs
      # ── 결제 (Toss) ──
      - key: TOSS_SECRET_KEY
        sync: false
      - key: TOSS_CLIENT_KEY
        sync: false
      - key: TOSS_WEBHOOK_SECRET
        sync: false
      - key: TOSS_WEBHOOK_SIGNING_SECRET
        sync: false
      - key: TOSS_WEBHOOK_IPS
        sync: false
      # ── 푸시 (Firebase) ──
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_PATH
        sync: false
      # ── 외부 API ──
      - key: GEMINI_API_KEY
        sync: false
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
      - key: SEOUL_OPENAPI_KEYS
        sync: false
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: NCP_GEOCODE_KEY_ID
        sync: false
      - key: NCP_GEOCODE_KEY
        sync: false
      # ── 프론트엔드 연동 ──
      - key: FRONTEND_URL
        sync: false
      # ── 파일 저장소 (운영 디스크는 재배포 시 초기화됨) ──
      - key: STORAGE_DRIVER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: uploads
      # ── SMS ──
      - key: SMS_API_KEY
        sync: false
      - key: SMS_API_SECRET
        sync: false
      - key: SMS_SENDER
        sync: false
      - key: SMS_ENV
        sync: false
      # ── CORS·알림·운영 ──
      - key: CORS_ORIGIN
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: SEED_KEY
        sync: false
