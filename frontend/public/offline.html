<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오프라인 — 위마켓</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .icon {
      width: 80px; height: 80px;
      background: #F97316;
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 44px; font-weight: 900; color: white;
      margin-bottom: 24px;
    }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 15px; color: #94a3b8; text-align: center; line-height: 1.6; max-width: 320px; }
    button {
      margin-top: 32px;
      padding: 12px 28px;
      background: #F97316;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="icon">W</div>
  <h1>인터넷 연결 없음</h1>
  <p>네트워크 연결이 끊어졌습니다.<br>연결을 확인한 후 다시 시도해 주세요.</p>
  <button onclick="window.location.reload()">다시 시도</button>
</body>
</html>
